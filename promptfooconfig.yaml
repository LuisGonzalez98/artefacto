# promptfooconfig.yaml — Evaluación de prompts del sistema Medida 83
#
# Ejecutar:
#   npx promptfoo eval                           # todos los tests (judge)
#   npx promptfoo eval -c tests/promptfoo_regulatorio.yaml   # agente regulatorio
#   npx promptfoo eval -c tests/promptfoo_redactor.yaml      # agente redactor
#   npx promptfoo view                           # abrir UI en el navegador
#
# Requiere:
#   npm install -g promptfoo   (o: npx promptfoo)
#   Ollama corriendo en http://172.17.39.193:11434 con llama3.1

description: "LLM-as-a-Judge — Evaluación del prompt evaluador del pipeline Medida 83"

providers:
  - id: ollama:chat:llama3.1
    config:
      apiBaseUrl: http://172.17.39.193:11434

prompts:
  - file://tests/prompts/judge_prompt.txt

defaultTest:
  options:
    # Temperatura 0.0 para evaluaciones reproducibles (igual que el LLMJudge real)
    temperature: 0.0

tests:
  # ── Test 1: JSON con 5 scores válidos para informe de calidad alta ─────────
  - description: "Judge retorna JSON con los 5 scores requeridos (informe bueno)"
    vars:
      question: "¿Cuál es el nivel de incumplimiento de la Medida 83 en Q4 2024?"
      min_score: 7
      datos_content: |
        Total de portaciones ejecutadas en Q4 2024: 45,320.
        Casos donde el AEP contactó al usuario portado dentro de los 60 días prohibidos: 1,247 (2.75%).
        Desglose por operador: Telcel 892 casos (71.5%), AT&T 248 casos (19.9%), Movistar 107 casos (8.6%).
        Tendencia mensual: octubre 0.42%, noviembre 0.38%, diciembre 0.31% — tendencia descendente.
        Periodo de mayor incumplimiento: días 1-15 post-portación concentran el 68% de los contactos.
      regulatorio_content: |
        La Medida 83 (CTOGÉSIMA TERCERA) de la Resolución de Portabilidad del IFT establece:
        "El Agente Económico Preponderante no podrá contactar al Usuario Final que haya sido portado
        desde su red durante los 60 días naturales posteriores a la ejecución de la portabilidad."
        Cualquier contacto dentro de este periodo constituye incumplimiento sancionable bajo
        el Artículo 256 de la LFTR, con multas de hasta 3% de los ingresos del operador.
        No existe umbral de tolerancia; cualquier contacto es infracción.
      redactor_content: |
        I. ANTECEDENTES Y BASE LEGAL
        La Medida 83 del IFT prohíbe al AEP contactar usuarios portados durante 60 días.

        II. METODOLOGÍA
        Se analizaron registros de portabilidad y contactos del Q4 2024 en la BD de portabilidad.

        III. HALLAZGOS PRINCIPALES
        Se detectaron 1,247 casos de incumplimiento (2.75% de las 45,320 portaciones).
        Telcel concentró el 71.5% de los incumplimientos. Tendencia descendente en el trimestre.

        IV. MARCO REGULATORIO
        Los incumplimientos son sancionables bajo el Art. 256 LFTR.

        V. CONCLUSIONES
        Se recomienda reforzar la supervisión en Telcel y revisar los primeros 15 días post-portación.
    assert:
      - type: javascript
        description: "Debe retornar JSON con los 5 scores en rango 1-10"
        value: |
          const match = output.match(/\{[\s\S]*\}/);
          if (!match) return { pass: false, reason: 'No se encontró JSON en la respuesta' };
          try {
            const d = JSON.parse(match[0]);
            const required = ['completitud','precision_datos','precision_regulatoria','coherencia','calidad_redaccion'];
            const missingScores = required.filter(k => !d.scores || d.scores[k] === undefined);
            if (missingScores.length > 0)
              return { pass: false, reason: 'Scores faltantes: ' + missingScores.join(', ') };
            const outOfRange = required.filter(k => d.scores[k] < 1 || d.scores[k] > 10);
            if (outOfRange.length > 0)
              return { pass: false, reason: 'Scores fuera de rango 1-10: ' + outOfRange.join(', ') };
            return { pass: true, reason: 'Todos los scores válidos' };
          } catch(e) {
            return { pass: false, reason: 'JSON inválido: ' + e.message };
          }

      - type: javascript
        description: "score_total debe ser numérico y aprobado debe ser booleano"
        value: |
          const match = output.match(/\{[\s\S]*\}/);
          if (!match) return { pass: false, reason: 'Sin JSON' };
          try {
            const d = JSON.parse(match[0]);
            if (typeof d.score_total !== 'number')
              return { pass: false, reason: 'score_total no es número: ' + typeof d.score_total };
            if (typeof d.aprobado !== 'boolean')
              return { pass: false, reason: 'aprobado no es booleano: ' + typeof d.aprobado };
            return { pass: true, reason: 'Tipos correctos' };
          } catch(e) { return { pass: false, reason: 'JSON inválido' }; }

      - type: javascript
        description: "fortalezas y sugerencias deben ser arrays no vacíos"
        value: |
          const match = output.match(/\{[\s\S]*\}/);
          if (!match) return { pass: false, reason: 'Sin JSON' };
          try {
            const d = JSON.parse(match[0]);
            if (!Array.isArray(d.fortalezas) || d.fortalezas.length === 0)
              return { pass: false, reason: 'fortalezas debe ser array no vacío' };
            if (!Array.isArray(d.sugerencias) || d.sugerencias.length === 0)
              return { pass: false, reason: 'sugerencias debe ser array no vacío' };
            return { pass: true, reason: 'Arrays correctos' };
          } catch(e) { return { pass: false, reason: 'JSON inválido' }; }

  # ── Test 2: Informe vacío/con errores debe ser RECHAZADO ──────────────────
  - description: "Judge rechaza informe con errores técnicos (aprobado=false)"
    vars:
      question: "Analiza el cumplimiento de la Medida 83 en Q4 2024."
      min_score: 7
      datos_content: "[El Agente Datos no pudo completar el análisis por error de conexión a la BD]"
      regulatorio_content: "[El Agente Regulatorio no encontró documentos normativos]"
      redactor_content: "[El Agente Redactor no pudo generar el informe por falta de insumos]"
    assert:
      - type: javascript
        description: "Informe con errores debe obtener aprobado=false"
        value: |
          const match = output.match(/\{[\s\S]*\}/);
          if (!match) return { pass: false, reason: 'Sin JSON en la respuesta' };
          try {
            const d = JSON.parse(match[0]);
            if (d.aprobado !== false)
              return { pass: false, reason: 'Se esperaba aprobado=false para informe con errores, recibido: ' + d.aprobado };
            return { pass: true, reason: 'Informe con errores correctamente rechazado' };
          } catch(e) { return { pass: false, reason: 'JSON inválido' }; }

      - type: javascript
        description: "Score total debe ser menor al mínimo (< 7) para informe vacío"
        value: |
          const match = output.match(/\{[\s\S]*\}/);
          if (!match) return { pass: false, reason: 'Sin JSON' };
          try {
            const d = JSON.parse(match[0]);
            if (d.score_total >= 7)
              return { pass: false, reason: 'Score ' + d.score_total + ' >= 7 para informe con errores' };
            return { pass: true, reason: 'Score bajo (' + d.score_total + ') para informe con errores' };
          } catch(e) { return { pass: false, reason: 'JSON inválido' }; }

  # ── Test 3: resumen debe ser texto coherente en español ───────────────────
  - description: "Judge produce resumen en español con al menos 50 caracteres"
    vars:
      question: "¿Hay incumplimientos de la Medida 83?"
      min_score: 7
      datos_content: "Total portaciones: 10,000. Incumplimientos detectados: 150 (1.5%)."
      regulatorio_content: "La Medida 83 prohíbe el contacto durante 60 días post-portación."
      redactor_content: |
        I. ANTECEDENTES: La Medida 83 establece restricciones.
        III. HALLAZGOS: 150 incumplimientos (1.5%).
        V. CONCLUSIONES: Nivel bajo de incumplimiento.
    assert:
      - type: javascript
        description: "El campo resumen debe tener al menos 50 caracteres"
        value: |
          const match = output.match(/\{[\s\S]*\}/);
          if (!match) return { pass: false, reason: 'Sin JSON' };
          try {
            const d = JSON.parse(match[0]);
            const resumen = d.resumen || '';
            if (resumen.length < 50)
              return { pass: false, reason: 'Resumen demasiado corto: ' + resumen.length + ' chars' };
            return { pass: true, reason: 'Resumen tiene ' + resumen.length + ' chars' };
          } catch(e) { return { pass: false, reason: 'JSON inválido' }; }
