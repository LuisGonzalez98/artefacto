# tests/promptfoo_redactor.yaml — Tests del Agente Redactor
#
# Ejecutar:
#   npx promptfoo eval -c tests/promptfoo_redactor.yaml

description: "Evaluación del prompt del Agente Redactor — Medida 83"

providers:
  - id: ollama:chat:llama3.1
    config:
      apiBaseUrl: http://172.17.39.193:11434

prompts:
  - file://tests/prompts/redactor_prompt.txt

defaultTest:
  options:
    temperature: 0.3  # igual que AgenteRedactor en producción

tests:
  # ── Test 1: Estructura del informe con 5 secciones ────────────────────────
  - description: "Informe incluye las 5 secciones requeridas"
    vars:
      question: "Analiza el cumplimiento de la Medida 83 en Q4 2024."
      template_context: "Usa lenguaje formal técnico-regulatorio. Párrafos densos, citas en formato 'De conformidad con...'."
      datos_result: |
        Total portaciones Q4 2024: 45,320.
        Casos de contacto prohibido: 1,247 (2.75%).
        Desglose: Telcel 892 (71.5%), AT&T 248 (19.9%), Movistar 107 (8.6%).
        Tendencia: octubre 0.42%, noviembre 0.38%, diciembre 0.31%.
      regulatorio_result: |
        La Medida 83 (CTOGÉSIMA TERCERA) prohíbe al AEP contactar usuarios portados durante
        60 días naturales. Sancionable bajo el Art. 256 de la LFTR.
        No existe umbral de tolerancia: cualquier contacto es infracción.
    assert:
      - type: icontains
        value: "ANTECEDENTES"
        description: "Sección I: Antecedentes y Base Legal"

      - type: icontains
        value: "METODOLOGÍA"
        description: "Sección II: Metodología de Análisis"

      - type: icontains
        value: "HALLAZGOS"
        description: "Sección III: Hallazgos Principales"

      - type: icontains
        value: "MARCO REGULATORIO"
        description: "Sección IV: Marco Regulatorio"

      - type: icontains
        value: "CONCLUSIONES"
        description: "Sección V: Conclusiones y Recomendaciones"

      - type: javascript
        description: "Informe debe tener al menos 500 caracteres"
        value: output.length > 500

  # ── Test 2: Integración de cifras exactas del Agente Datos ───────────────
  - description: "El informe integra las cifras exactas del análisis de datos"
    vars:
      question: "Resume el incumplimiento de la Medida 83."
      template_context: "Lenguaje formal regulatorio."
      datos_result: "Se identificaron exactamente 1,247 casos de contacto prohibido en 45,320 portaciones."
      regulatorio_result: "La Medida 83 prohíbe el contacto durante 60 días. No hay umbral de tolerancia."
    assert:
      - type: icontains
        value: "1,247"
        description: "Debe incluir la cifra exacta de incumplimientos"

      - type: icontains
        value: "Medida 83"
        description: "Debe mencionar la Medida 83 explícitamente"

  # ── Test 3: Tono formal y referencias cruzadas ────────────────────────────
  - description: "El informe usa lenguaje técnico-regulatorio formal"
    vars:
      question: "Analiza el cumplimiento de la Medida 83."
      template_context: "Usa expresiones como 'De conformidad con...', 'En ese sentido...', 'Cabe señalar que...'."
      datos_result: "Portaciones: 10,000. Incumplimientos: 150 (1.5%). Operador: Telcel 120 casos."
      regulatorio_result: "La Medida 83 del IFT prohíbe el contacto durante 60 días naturales post-portación."
    assert:
      - type: javascript
        description: "Debe usar lenguaje formal regulatorio (términos técnicos)"
        value: |
          const formalTerms = [
            'de conformidad', 'cabe señalar', 'en ese sentido', 'normativa',
            'regulatorio', 'cumplimiento', 'incumplimiento', 'concesionario',
            'IFT', 'portación', 'LFTR'
          ];
          const lc = output.toLowerCase();
          const found = formalTerms.filter(t => lc.includes(t));
          return {
            pass: found.length >= 3,
            reason: found.length >= 3
              ? 'Términos formales encontrados: ' + found.join(', ')
              : 'Solo ' + found.length + ' término(s) formal(es): ' + found.join(', ')
          };

  # ── Test 4: Longitud apropiada para informe regulatorio ──────────────────
  - description: "Informe tiene longitud apropiada (500-2500 palabras aprox.)"
    vars:
      question: "Genera el informe completo de cumplimiento de la Medida 83."
      template_context: "Objetivo: 500-700 palabras en el cuerpo del informe."
      datos_result: |
        Total portaciones: 45,320. Incumplimientos: 1,247 (2.75%).
        Telcel: 892 casos. AT&T: 248. Movistar: 107.
        Tendencia mensual: oct 0.42%, nov 0.38%, dic 0.31%.
      regulatorio_result: |
        Medida 83: prohibición de 60 días. Art. 256 LFTR para sanciones.
        Cualquier contacto es infracción, sin umbral de tolerancia.
    assert:
      - type: javascript
        description: "Entre 1500 y 6000 caracteres (aprox. 250-1000 palabras)"
        value: |
          return {
            pass: output.length >= 1500 && output.length <= 6000,
            reason: 'Longitud: ' + output.length + ' caracteres'
          };
