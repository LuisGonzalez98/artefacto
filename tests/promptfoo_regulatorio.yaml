# tests/promptfoo_regulatorio.yaml — Tests del Agente Regulatorio
#
# Ejecutar:
#   npx promptfoo eval -c tests/promptfoo_regulatorio.yaml

description: "Evaluación del prompt del Agente Regulatorio — Medida 83"

providers:
  - id: ollama:chat:llama3.1
    config:
      apiBaseUrl: http://172.17.39.193:11434

prompts:
  - file://tests/prompts/regulatorio_prompt.txt

defaultTest:
  options:
    temperature: 0.1

tests:
  # ── Test 1: Conocimiento básico de la Medida 83 ───────────────────────────
  - description: "Menciona los elementos clave de la Medida 83 (IFT, 60 días, AEP)"
    vars:
      question: "¿Qué establece la Medida 83 sobre el contacto post-portación?"
      regulatory_context: "No hay documentos regulatorios disponibles. Usa conocimiento interno sobre la normativa del IFT."
      datos_result: "Total de portaciones analizadas: 45,320. Casos de incumplimiento: 1,247 (2.75%)."
    assert:
      - type: icontains
        value: "Medida 83"
        description: "Debe mencionar explícitamente la Medida 83"

      - type: icontains
        value: "60"
        description: "Debe mencionar los 60 días naturales de restricción"

      - type: icontains
        value: "IFT"
        description: "Debe mencionar al Instituto Federal de Telecomunicaciones"

      - type: javascript
        description: "Respuesta debe tener más de 200 caracteres"
        value: output.length > 200

  # ── Test 2: Identificación del Agente Económico Preponderante ─────────────
  - description: "Identifica al AEP como sujeto obligado de la Medida 83"
    vars:
      question: "¿A qué operadores aplica la Medida 83?"
      regulatory_context: "No hay documentos disponibles."
      datos_result: "Análisis de portaciones del sector."
    assert:
      - type: icontains
        value: "preponderante"
        description: "Debe mencionar al Agente Económico Preponderante"

      - type: javascript
        description: "No debe retornar respuesta vacía"
        value: output.trim().length > 0

  # ── Test 3: Análisis de sanciones ─────────────────────────────────────────
  - description: "Explica las consecuencias del incumplimiento"
    vars:
      question: "¿Cuáles son las sanciones por violar la Medida 83?"
      regulatory_context: "Consulta el marco normativo general del IFT y la LFTR."
      datos_result: "Se detectaron 1,247 casos de contacto prohibido (2.75% de las portaciones)."
    assert:
      - type: javascript
        description: "Debe mencionar sanciones o consecuencias legales"
        value: |
          const keywords = ['sanción', 'sancionable', 'multa', 'infracción', 'LFTR', 'consecuencia'];
          const lc = output.toLowerCase();
          const found = keywords.filter(k => lc.includes(k));
          return {
            pass: found.length > 0,
            reason: found.length > 0
              ? 'Menciona: ' + found.join(', ')
              : 'No menciona ningún término de sanción/consecuencia'
          };

  # ── Test 4: Contextualización de hallazgos ────────────────────────────────
  - description: "Contextualiza los datos cuantitativos en el marco regulatorio"
    vars:
      question: "¿Los 2.75% de incumplimientos son materia de sanción?"
      regulatory_context: "La Medida 83 no establece umbral de tolerancia."
      datos_result: "Incumplimiento: 1,247 casos de 45,320 portaciones (2.75%). Operador principal: Telcel."
    assert:
      - type: javascript
        description: "Debe mencionar a Telcel o al operador con más incumplimientos"
        value: output.toLowerCase().includes('telcel') || output.toLowerCase().includes('operador')

      - type: javascript
        description: "Respuesta coherente con al menos 150 caracteres"
        value: output.trim().length > 150
